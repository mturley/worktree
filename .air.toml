root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/main ."
  entrypoint = ["./tmp/main"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "ui", "docs", ".git"]
  delay = 200
  # Restart by killing outright: worktree ui refuses SIGINT while a job runs (internal/webui/stop.go). The killed job comes back "interrupted".
  send_interrupt = false

[log]
  time = false

[misc]
  clean_on_exit = true
